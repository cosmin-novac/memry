# Quick self-host: `cp .env.example .env`, set MEMRY_API_KEY, the text model key
# and the decision model, then `docker compose up -d`. The container binds
# 0.0.0.0 inside the network namespace and this file publishes port 8787, so a
# key is REQUIRED - without it `memry serve` doesn't start, so the memory store
# is never open to the network.
services:
  memry:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - memry-data:/data
    environment:
      MEMRY_API_KEY: ${MEMRY_API_KEY:?set MEMRY_API_KEY in .env (bearer token for REST and MCP)}
      MEMRY_DB_PATH: /data/memry.db
      # Text model for extraction (required; the server doesn't start without
      # one). The image contains both SDKs. With OpenAI, Memry uses the one key
      # for extraction and embeddings; it uses Anthropic only when that is the
      # only key present.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MEMRY_LLM_MODEL: ${MEMRY_LLM_MODEL:-}
      # Decision model (required) for entity identity and Memry's other decision
      # questions: "jev" is TypeSafe's System One model. Set "llm" only on
      # purpose: Memry then sends these questions to the text model above,
      # and you confirm every entity merge yourself.
      MEMRY_DECISION_PROVIDER: ${MEMRY_DECISION_PROVIDER:?set MEMRY_DECISION_PROVIDER in .env (jev, or llm to send the decision questions to the text model)}
      MEMRY_DECISION_API_KEY: ${MEMRY_DECISION_API_KEY:-}
      MEMRY_DECISION_MODEL: ${MEMRY_DECISION_MODEL:-}
      MEMRY_DECISION_BASE_URL: ${MEMRY_DECISION_BASE_URL:-}
      MEMRY_DECISION_MERGE_CONFIDENCE: ${MEMRY_DECISION_MERGE_CONFIDENCE:-}
      MEMRY_DECISION_RERANK: ${MEMRY_DECISION_RERANK:-}
    restart: unless-stopped

volumes:
  memry-data:
