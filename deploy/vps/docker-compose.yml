name: memry

services:
  memry:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      MEMRY_DB_PATH: /data/memry.db
      MEMRY_API_KEY: ${MEMRY_API_KEY:?set MEMRY_API_KEY in .env (see .env.example)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEMRY_LLM_PROVIDER: ${MEMRY_LLM_PROVIDER:-}
      MEMRY_LLM_MODEL: ${MEMRY_LLM_MODEL:-}
      MEMRY_LLM_EFFORT: ${MEMRY_LLM_EFFORT:-}
      MEMRY_EMBEDDING_PROVIDER: ${MEMRY_EMBEDDING_PROVIDER:-}
      # Decision model (required) for entity identity and Memry's other decision
      # questions: "jev" is TypeSafe's System One model. Set "llm" only on
      # purpose: Memry then sends these questions to the text model,
      # merges entities only by fixed rules, and you confirm the other merges.
      MEMRY_DECISION_PROVIDER: ${MEMRY_DECISION_PROVIDER:?set MEMRY_DECISION_PROVIDER in .env (jev, or llm to send the decision questions to the text model)}
      MEMRY_DECISION_API_KEY: ${MEMRY_DECISION_API_KEY:-}
      MEMRY_DECISION_MODEL: ${MEMRY_DECISION_MODEL:-}
      MEMRY_DECISION_BASE_URL: ${MEMRY_DECISION_BASE_URL:-}
      MEMRY_DECISION_MERGE_CONFIDENCE: ${MEMRY_DECISION_MERGE_CONFIDENCE:-}
      MEMRY_DECISION_RERANK: ${MEMRY_DECISION_RERANK:-}
      MEMRY_DURABILITY: ${MEMRY_DURABILITY:-}
      MEMRY_TENANTS: ${MEMRY_TENANTS:-}
      # Set to your public https URL to turn on OAuth for accounts (see
      # docs/self-hosting.md#accounts-and-oauth). Unset = OAuth off.
      MEMRY_PUBLIC_URL: ${MEMRY_PUBLIC_URL:-}
      # Nightly verified copy of memry.db and auth.db (docs/self-hosting.md#nightly-snapshot),
      # written to /backups: the host directory mounted below, outside the Docker
      # data volume. MEMRY_SNAPSHOT_DIR= (empty) in .env turns it off.
      MEMRY_SNAPSHOT_DIR: ${MEMRY_SNAPSHOT_DIR-/backups}
      MEMRY_SNAPSHOT_AT: ${MEMRY_SNAPSHOT_AT:-03:30}
      MEMRY_SNAPSHOT_HOST_DIR: ${MEMRY_SNAPSHOT_HOST_DIR:-/var/backups/memry}
      # The clock MEMRY_SNAPSHOT_AT is read on. Empty is UTC.
      TZ: ${MEMRY_TZ:-}
      # Optional offsite copy to an S3-compatible bucket (Cloudflare R2, Backblaze
      # B2, Contabo Object Storage). Off unless URL and bucket are set.
      MEMRY_SNAPSHOT_OFFSITE_URL: ${MEMRY_SNAPSHOT_OFFSITE_URL:-}
      MEMRY_SNAPSHOT_OFFSITE_BUCKET: ${MEMRY_SNAPSHOT_OFFSITE_BUCKET:-}
      MEMRY_SNAPSHOT_OFFSITE_KEY_ID: ${MEMRY_SNAPSHOT_OFFSITE_KEY_ID:-}
      MEMRY_SNAPSHOT_OFFSITE_SECRET: ${MEMRY_SNAPSHOT_OFFSITE_SECRET:-}
      MEMRY_SNAPSHOT_OFFSITE_REGION: ${MEMRY_SNAPSHOT_OFFSITE_REGION:-}
      MEMRY_SNAPSHOT_OFFSITE_PREFIX: ${MEMRY_SNAPSHOT_OFFSITE_PREFIX:-}
    volumes:
      - memry-data:/data
      # the nightly snapshot; deploy/install.sh creates it root-only (0700)
      - ${MEMRY_SNAPSHOT_HOST_DIR:-/var/backups/memry}:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - memry
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # A real domain enables automatic HTTPS; the default serves plain HTTP.
      MEMRY_DOMAIN: ${MEMRY_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  memry-data:
  caddy-data:
  caddy-config:
