#cloud-config
# Boot a fresh VPS straight into a running Memry server.
#
# Paste this into the "Cloud-Init" / "User data" box when creating the instance
# (Contabo: under Cloud-Init in the order form; Hetzner: Cloud config;
# DigitalOcean: User data). Ubuntu or Debian images.
#
# Edit MEMRY_DOMAIN to your domain (DNS A record pointing at the new server)
# for automatic HTTPS, or remove it to serve plain HTTP on port 80.
# Give the installer a text model key (OPENAI_API_KEY, or ANTHROPIC_API_KEY)
# and the decision model (MEMRY_DECISION_PROVIDER=jev with a TypeSafe key in
# MEMRY_DECISION_API_KEY). With MEMRY_DECISION_PROVIDER=llm, set on purpose,
# Memry sends the decision questions to the text model and you confirm every
# entity merge yourself.
#
# After boot, the generated API key is in /opt/memry/.env on the server.

package_update: true

runcmd:
  - curl -fsSL https://raw.githubusercontent.com/cosmin-novac/memry/main/deploy/install.sh | MEMRY_DOMAIN=memory.example.com OPENAI_API_KEY=sk-... MEMRY_DECISION_PROVIDER=jev MEMRY_DECISION_API_KEY=... bash
