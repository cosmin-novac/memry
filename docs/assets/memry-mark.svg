        fill="none" stroke="#14b8a6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="47" cy="10.5" r="4.5" fill="#14b8a6"/>
  <circle cx="56" cy="20" r="3.2" fill="#14b8a6" opacity="0.85"/>
  <circle cx="57.5" cy="30" r="2.2" fill="#14b8a6" opacity="0.7"/>
</svg>
