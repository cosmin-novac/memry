[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memry"
version = "0.2.5"
description = "The open, self-hostable memory layer for AI agents. MCP-native, local-first, research-grade."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Memry contributors" }]
keywords = ["memory", "llm", "agents", "mcp", "ai", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mem0 = ["mem0ai>=0.1.100"]
ann = ["usearch>=2.12"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
memry = "memry.cli:main"

[project.urls]
Homepage = "https://memry.tech"
Repository = "https://github.com/cosmin-novac/memry"
Documentation = "https://github.com/cosmin-novac/memry/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/memry"]

# The published package is code only: no docs/, evals/, tests/, website/, deploy/.
[tool.hatch.build.targets.sdist]
only-include = ["src/memry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
