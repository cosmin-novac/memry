name: pypi-canary

# Weekly proof that the PUBLISHED package still installs and imports on a
# clean machine with today's dependency resolution. mcp 2.0.0 (2026-07-28)
# broke `pip install memry` 0.2.25 two days after release and nobody noticed
# for weeks; this job turns that into a red run + email within a week.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  install-from-pypi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: pip install memry (latest on PyPI, fresh resolution)
        run: python -m pip install --no-cache-dir memry
      - name: import + CLI smoke
        run: |
          python -c "import memry, memry.rest, memry.mcp_server, memry.cli; print('memry', memry.__version__)"
          memry --help >/dev/null
      - name: released version matches the latest tag
        run: |
          PYPI=$(python -c "import memry; print(memry.__version__)")
          TAG=$(curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/latest | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "pypi=$PYPI latest-release=$TAG"
          test "$PYPI" = "$TAG"
      - name: run the test suite of that same tag against the installed wheel
        run: |
          VERSION=$(python -c "import memry; print(memry.__version__)")
          # tests/ plus the repo files they read (evals/datasets for the CLI eval
          # test, pyproject.toml for pytest config); anchored so src/ never lands
          # next to the installed wheel.
          curl -fsSL "https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/v$VERSION" \
            | tar xz --strip-components=1 --no-wildcards-match-slash --wildcards \
                'memry-*/tests' 'memry-*/evals' 'memry-*/pyproject.toml'
          python -m pip install pytest
          python -m pytest -q -p no:dash tests -x -k "not container_build and not release_check"
