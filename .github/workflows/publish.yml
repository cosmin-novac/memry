name: release

# Push to main with a new __version__ in src/memry/__init__.py = a release.
# CI tags, publishes to PyPI (trusted publishing, environment "pypi"), and
# creates the GitHub release with generated notes.
#
# Pushes without a version bump are allowed ONLY if nothing shipped changed
# (docs, tests, website, deploy scripts). If src/, pyproject.toml, Dockerfile
# or requirements-docker.txt differ from the last tag under the same version,
# the check job FAILS: that is exactly the state where PyPI, GitHub main and
# deployments drift apart. deploy/release_check.py holds the rule and is
# shared with the local pre-push hook (deploy/git-hooks/pre-push).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          set -o pipefail
          python3 deploy/release_check.py | tee check.out
          grep -E '^(release|version)=' check.out >> "$GITHUB_OUTPUT"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: [check, test]
    if: github.event_name != 'pull_request' && needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memry
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "Memry v${{ needs.check.outputs.version }}" \
            --generate-notes
